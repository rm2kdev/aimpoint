name: CI

# Typecheck, lint, unit tests and a production build on every push to main/development and on
# pull requests. Drives the README build badge:
# https://github.com/rm2kdev/aimpoint/actions/workflows/ci.yml/badge.svg
#
# No secrets: `next build` needs no live services (MongoDB connects lazily on the first request and
# every route renders on demand), so the build runs with the harmless placeholders below.
# Deployment stays with Vercel; this workflow never deploys.

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders only, never real values. Port 1 is closed, so any accidental DB use at build time fails.
      MONGODB_URI: mongodb://127.0.0.1:1
      MONGODB_DB: aimpoint-ci
      AUTH_SECRET: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node 24: `pnpm test` relies on node --test globs and built-in TypeScript type stripping.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A fresh checkout has no .next/types, so generate Next's route types (PageProps etc.) before tsc.
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit -p .

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
