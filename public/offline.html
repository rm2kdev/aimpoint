<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <title>You're offline · Aimpoint</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Served by the service worker (VEC-156) when a page can't reach the network. Self-contained:
         no app CSS/JS, since those may not be cached. Colours match globals.css. -->
    <script>
      // Follow the app's theme choice (next-themes stores it as localStorage.theme).
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.className = "dark";
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #171717;
        --muted: #5c5c5c;
        --border: #ececea;
        --btn: #171717;
        --btn-fg: #fafafa;
        color-scheme: light;
      }
      .dark {
        --bg: #0a0a0a;
        --fg: #ededed;
        --muted: #a1a1a1;
        --border: #1f1f1f;
        --btn: #ededed;
        --btn-fg: #0a0a0a;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      html { touch-action: manipulation; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 340px; text-align: center; }
      svg { width: 48px; height: 48px; display: block; margin: 0 auto 20px; border-radius: 13px; }
      /* The mark is near-black; outline it so it doesn't vanish on the dark background. */
      .dark svg { box-shadow: 0 0 0 1px #2e2e2e; }
      h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
      button {
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: var(--btn);
        color: var(--btn-fg);
        font: inherit;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
      button[disabled] { opacity: 0.6; cursor: default; }
      .hint { margin: 14px 0 0; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6.5" fill="#171717" />
        <path d="M5.5 7 10.5 17.5 14 11 18.5 6M14 11l4.5 4.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
        <g fill="#ffffff">
          <circle cx="5.5" cy="7" r="1.5" />
          <circle cx="10.5" cy="17.5" r="2.1" />
          <circle cx="14" cy="11" r="1.8" />
          <circle cx="18.5" cy="6" r="1.5" />
          <circle cx="18.5" cy="15.5" r="1.2" />
          <circle cx="6" cy="16" r="0.8" fill-opacity="0.5" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>Aimpoint can't reach the server right now. Check your connection and try again.</p>
      <button type="button" id="retry">Try again</button>
      <p class="hint" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      var btn = document.getElementById("retry");
      var status = document.getElementById("status");
      function retry() {
        btn.disabled = true;
        status.textContent = "Reconnecting…";
        location.reload();
      }
      btn.addEventListener("click", retry);
      // Come back by itself as soon as the device reports a connection again.
      window.addEventListener("online", retry);
      if (!navigator.onLine) status.textContent = "This device is offline.";
    </script>
  </body>
</html>
